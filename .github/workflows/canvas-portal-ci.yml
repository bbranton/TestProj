# Canvas portal CI: tests and builds the Canvas portal app in canvas-portal/.
#
# What it checks:
#   - backend: installs the Python backend and runs its tests with pytest.
#   - frontend: installs the frontend with npm ci, runs its tests, and
#     builds it, so a change that breaks the build fails here.
#
# When it runs: on every pull request, and on pushes to main and develop,
# but only when files under canvas-portal/ or this workflow change. Docs-only
# PRs get no checks from it; the ci-paths skill says whether a branch
# triggers it. It only tests and builds: it deploys nothing, uses no
# secrets, and its automatic GitHub token can only read the repo.

name: Canvas portal CI

on:
  pull_request:
    paths: ["canvas-portal/**", ".github/workflows/canvas-portal-ci.yml"]
  push:
    branches: [main, develop]
    paths: ["canvas-portal/**", ".github/workflows/canvas-portal-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-portal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      # Ruff, pinned in pyproject.toml. Fails on unformatted code or a lint
      # problem; `ruff format .` and `ruff check --fix .` fix most locally.
      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-portal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canvas-portal/frontend/package-lock.json
      - name: Install
        run: npm ci
      # Prettier and ESLint, from package.json. `npm run format` fixes
      # formatting locally; ESLint problems are fixed by hand.
      - name: Format and lint
        run: |
          npm run format:check
          npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
