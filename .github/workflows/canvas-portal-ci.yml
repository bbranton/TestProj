# Canvas portal CI: tests and builds the Canvas portal app in canvas-portal/.
#
# What it checks:
#   - backend: installs the Python backend, checks its format and lint
#     with Ruff, and runs its tests with pytest.
#   - frontend: installs the frontend with npm ci, checks its format and
#     lint with Prettier and ESLint, runs its tests, and builds it, so a
#     change that breaks the build fails here.
#   Once Install succeeds, each later step runs even if an earlier one
#   failed, so one CI run shows every problem.
#
# When it runs: on every pull request, and on pushes to main and develop,
# but only when files under canvas-portal/ or this workflow change. Docs-only
# PRs get no checks from it; the ci-paths skill says whether a branch
# triggers it. It only tests and builds: it deploys nothing, uses no
# secrets, and its automatic GitHub token can only read the repo.

name: Canvas portal CI

on:
  pull_request:
    paths: ["canvas-portal/**", ".github/workflows/canvas-portal-ci.yml"]
  push:
    branches: [main, develop]
    paths: ["canvas-portal/**", ".github/workflows/canvas-portal-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-portal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        id: install
        run: pip install -e ".[dev]"
      # Ruff, pinned in pyproject.toml. `ruff format .` and
      # `ruff check --fix .` fix most problems locally.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-portal/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canvas-portal/frontend/package-lock.json
      - name: Install
        id: install
        run: npm ci
      # Prettier and ESLint, from package.json. `npm run format` fixes
      # formatting locally; ESLint problems are fixed by hand.
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
