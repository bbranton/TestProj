name: Canvas portal CI

on:
  pull_request:
    paths: ["canvas-portal/**", ".github/workflows/canvas-portal-ci.yml"]
  push:
    branches: [master]
    paths: ["canvas-portal/**", ".github/workflows/canvas-portal-ci.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-portal/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
