[project]
name = "canvas-portal-backend"
version = "0.1.0"
description = "Backend API for the Canvas Assignments Portal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Ruff formats and lints the backend: `ruff format .` and `ruff check .`.
# Its defaults (88-column lines, double quotes) match the coding standards.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# The defaults (pyflakes and the pycodestyle errors), plus import sorting,
# pyupgrade, bugbear for likely bugs, and print (T20), since the backend
# logs with logging, never print.
extend-select = ["I", "UP", "B", "T20"]
