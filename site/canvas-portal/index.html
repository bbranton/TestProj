<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Portal</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f4; --text: #222; --muted: #666; --accent: #2a6fdb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181c; --text: #eee; --muted: #aaa; --accent: #6ea2ff; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px; text-align: center; }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Canvas Portal</h1>
    <p>Coming soon. This app is being planned.</p>
    <a href="../">&larr; All projects</a>
  </main>
</body>
</html>
