<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestProj</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f4; --card: #fff; --text: #222; --muted: #666; --accent: #2a6fdb; --border: #ddd; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16181c; --card: #22252b; --text: #eee; --muted: #aaa; --accent: #6ea2ff; --border: #333; }
    }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 8px; }
    p.lead { margin: 0 0 32px; color: var(--muted); }
    .projects { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    a.card { display: block; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; color: inherit; text-decoration: none; }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); }
    a.card h2 { margin: 0 0 6px; font-size: 1.15rem; color: var(--accent); }
    a.card p { margin: 0; color: var(--muted); line-height: 1.4; }
    .tag { display: inline-block; margin-top: 12px; font-size: 0.8rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>TestProj</h1>
    <p class="lead">Pick a project to open.</p>
    <div class="projects">
      <a class="card" href="qml-hello/">
        <h2>QML Hello World</h2>
        <p>A Qt 6.8 Quick app compiled to WebAssembly, running in the browser.</p>
        <span class="tag">Live</span>
      </a>
      <a class="card" href="canvas-portal/">
        <h2>Canvas Portal</h2>
        <p>A new web app, currently being planned.</p>
        <span class="tag">Coming soon</span>
      </a>
    </div>
  </main>
</body>
</html>
